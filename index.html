<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef3f4" />
    <meta name="color-scheme" content="light" />

    <script>
      (function () {
        var stored = localStorage.getItem('theme')
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0b1026' : '#eef3f4'
        document.querySelector('meta[name="color-scheme"]').content = dark ? 'dark' : 'light'
      })()
    </script>

    <title>NE Sokhean | Computer Science Portfolio</title>
    <meta
      name="description"
      content="Portfolio of NE Sokhean, a third-year Computer Science student at RUPP in Phnom Penh, building software, backend systems and cloud foundations."
    />
    <meta name="author" content="NE Sokhean" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/img/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Onest:wght@400;500&display=swap"
    />
